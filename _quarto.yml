format:
  html:
    css: styles.css
    theme: cosmo
    highlight-style: atom-one
    toc: true
    number-sections: true
    number-depth: 3
    grid:
      body-width: 850px
    #self-contained: true
    #license: "CC BY-NC"

execute:
  freeze: auto
  engine: knitr
  eval: true
editor: source

knitr:
  opts_chunk:
    class-output: regular-r-output
    class-message: regular-r-output
    class-warning: warning-r-output
    class-error: error-r-output
